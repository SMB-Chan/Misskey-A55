services:
  web:
    image: misskey/misskey:2026.10.0-a55
    container_name: misskey-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
      - external_network
    environment:
      - NODE_OPTIONS=--max-old-space-size=400 --require /misskey/.config/a55-guard.cjs
    mem_limit: 768m
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro

  redis:
    image: redis:7-alpine
    container_name: misskey-redis
    restart: always
    networks:
      - internal_network
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 96m
    volumes:
      - ./redis:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  db:
    image: postgres:18-alpine
    container_name: misskey-db
    restart: always
    networks:
      - internal_network
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - idle_session_timeout=120s
    mem_limit: 384m
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: misskey-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    networks:
      - internal_network
      - external_network
    depends_on:
      - web

networks:
  internal_network:
    internal: true
  external_network:
