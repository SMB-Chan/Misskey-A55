services:
  web:
    image: misskey/misskey:2026.10.0-a55v7
    container_name: misskey-web
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal_network
      - external_network
    command:
      - sh
      - -c
      - cd /misskey/packages/backend && node ./scripts/compile_config.js && node ./node_modules/typeorm/cli.js migration:run -d ormconfig.js && exec node --max-old-space-size=320 --dns-result-order=ipv4first --require /misskey/.config/a55-guard.cjs ./built/entry.js
    environment:
      - MK_DISABLE_CLUSTERING=1
      - MK_ONLY_SERVER=1
      - UV_THREADPOOL_SIZE=2
    mem_limit: 512m
    cpuset: "0-1"
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro
    healthcheck:
      test: ["CMD", "/bin/bash", "/misskey/healthcheck.sh"]
      interval: 5s
      retries: 20

  queue:
    image: misskey/misskey:2026.10.0-a55v7
    container_name: misskey-queue
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_healthy
    networks:
      - internal_network
      - external_network
    command:
      - sh
      - -c
      - cd /misskey/packages/backend && node ./scripts/compile_config.js && exec node --max-old-space-size=256 --dns-result-order=ipv4first --require /misskey/.config/a55-guard.cjs ./built/entry.js
    environment:
      - MK_DISABLE_CLUSTERING=1
      - MK_ONLY_QUEUE=1
      - MK_NO_DAEMONS=1
      - UV_THREADPOOL_SIZE=2
    mem_limit: 448m
    cpuset: "2-3"
    volumes:
      - ./files:/misskey/files
      - ./.config:/misskey/.config:ro
    healthcheck:
      disable: true

  redis:
    image: redis:7-alpine
    container_name: misskey-redis
    restart: always
    networks:
      - internal_network
    command: ["redis-server", "--maxmemory", "64mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 96m
    volumes:
      - ./redis:/data
    healthcheck:
      test: "redis-cli ping"
      interval: 5s
      retries: 20

  db:
    image: postgres:18-alpine
    container_name: misskey-db
    restart: always
    networks:
      - internal_network
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=256MB
      - -c
      - jit=off
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_workers=0
      - -c
      - autovacuum_max_workers=1
      - -c
      - wal_compression=on
      - -c
      - idle_in_transaction_session_timeout=30s
    mem_limit: 384m
    env_file:
      - .config/docker.env
    volumes:
      - ./db:/var/lib/postgresql
    healthcheck:
      test: "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"
      interval: 5s
      retries: 20

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: misskey-cloudflared
    restart: always
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    mem_limit: 96m
    networks:
      - internal_network
      - external_network
    depends_on:
      - web

networks:
  internal_network:
    internal: true
  external_network:
