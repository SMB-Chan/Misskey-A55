# Misskey configuration (example)
# Replace url and passwords with your own. Do NOT change url after first start.
url: https://your-domain.example/

port: 3000

db:
  host: db
  port: 5432
  db: misskey
  user: misskey
  pass: CHANGE_ME_DB_PASSWORD

dbReplications: false

redis:
  host: redis
  port: 6379
  family: 4

fulltextSearch:
  provider: sqlLike

id: 'aidx'

# --- Tuning for 2GB RAM / Cortex-A55 x4 ---
# These override the image fallbacks (deliver 2 / inbox 1).
clusterLimit: 1
threadPoolSize: 1
outgoingAddressFamily: ipv4
deliverJobConcurrency: 2
deliverJobPerSec: 4
inboxJobConcurrency: 1
inboxJobPerSec: 2
relationshipJobConcurrency: 2
relationshipJobPerSec: 4
deliverJobMaxAttempts: 4
inboxJobMaxAttempts: 4

logging:
  level: warn
  domains:
    db.sql: off
    queue: error
