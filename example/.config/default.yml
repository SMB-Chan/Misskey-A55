# Misskey configuration (example)
# Replace url and passwords with your own. Do NOT change url after first start.
url: https://your-domain.example/

port: 3000

db:
  host: db
  port: 5432
  db: misskey
  user: misskey
  pass: CHANGE_ME_DB_PASSWORD

dbReplications: false

redis:
  host: redis
  port: 6379

fulltextSearch:
  provider: sqlLike

id: 'aidx'

# --- Tuning for 2GB RAM / ARM 4-core ---
clusterLimit: 1
deliverJobConcurrency: 16
deliverJobPerSec: 16
inboxJobConcurrency: 4
inboxJobPerSec: 8
